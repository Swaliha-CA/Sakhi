<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="90" fill="url(#primaryGradient)" opacity="0.1" filter="url(#glow)"/>
  
  <path d="M100 160 C100 160, 140 130, 140 100 C140 80, 125 70, 110 70 C105 70, 100 75, 100 75 C100 75, 95 70, 90 70 C75 70, 60 80, 60 100 C60 130, 100 160, 100 160 Z" 
        fill="url(#primaryGradient)" 
        filter="url(#glow)"/>
  
  <path d="M85 50 Q70 50, 70 65 Q70 75, 80 80 Q95 85, 95 95 Q95 105, 85 110 Q75 115, 65 110" 
        stroke="url(#accentGradient)" 
        stroke-width="6" 
        stroke-linecap="round" 
        fill="none"
        opacity="0.9"/>
  
  <circle cx="130" cy="60" r="12" fill="url(#accentGradient)" opacity="0.8"/>
  <line x1="130" y1="72" x2="130" y2="95" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="120" y1="85" x2="140" y2="85" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  
  <circle cx="50" cy="90" r="4" fill="#7C3AED" opacity="0.6"/>
  <circle cx="150" cy="110" r="4" fill="#EC4899" opacity="0.6"/>
  <circle cx="70" cy="140" r="3" fill="#F97316" opacity="0.5"/>
  <circle cx="130" cy="140" r="3" fill="#7C3AED" opacity="0.5"/>
</svg>
